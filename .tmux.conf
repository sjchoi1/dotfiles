# Simple tmux config

# Mouse support
set -g mouse on

# Enable mouse wheel scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Start windows at 1
set -g base-index 1

# No delay for escape key
set -s escape-time 0

# Scrollback history
set -g history-limit 50000

# True color
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Status bar
set -g status-style 'bg=colour235 fg=colour255'
set -g status-left '#[fg=colour255,bg=colour24] #S '
set -g status-right '#[fg=colour255,bg=colour24] %H:%M '

# Window status
setw -g window-status-current-style 'fg=colour255 bg=colour24 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=colour250 bg=colour235'
setw -g window-status-format ' #I:#W '
