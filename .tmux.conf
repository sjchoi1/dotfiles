# Simple tmux config

# Mouse support
set -g mouse on

# Start windows at 1
set -g base-index 1

# No delay for escape key
set -s escape-time 0

# Scrollback history
set -g history-limit 100000

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc,tmux-256color:Ms=\\033]52;c;%p2%s\\a"

# Status bar
set -g status-style 'bg=colour235 fg=colour255'
set -g status-left '#[fg=colour255,bg=colour24] #S '
set -g status-right '#[fg=colour255,bg=colour24] %H:%M '

# Window status
setw -g window-status-current-style 'fg=colour255 bg=colour24 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=colour250 bg=colour235'
setw -g window-status-format ' #I:#W '
