# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Clipboard support (for vim copy/paste)
set -g set-clipboard on

# Status bar (GREEN theme - different from vim's blue)
set -g status-position bottom
set -g status-style 'bg=colour235 fg=colour255'
set -g status-left '#[fg=colour255,bg=colour22] #S '
set -g status-right '#[fg=colour255,bg=colour235] %Y-%m-%d #[fg=colour255,bg=colour22] %H:%M '
set -g status-left-length 20

# Window status (GREEN accents)
setw -g window-status-current-style 'fg=colour255 bg=colour22 bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'fg=colour250 bg=colour235'
setw -g window-status-format ' #I:#W#F '

# Pane borders (GREEN)
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour22'
